<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../imgs/favicon.png" type="image/png">
  <title>Stickers - PHANTOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --white: #ffffff;
      --off-white: #c8c8c8;
      --gray: #666;
      --gray-light: #999;
      --dark: #0a0a0a;
      --border: rgba(255,255,255,0.07);
      --border-bright: rgba(255,255,255,0.18);
      --glow-sm: 0 0 12px rgba(255,255,255,0.12), 0 0 30px rgba(255,255,255,0.05);
      --glow-md: 0 0 20px rgba(255,255,255,0.18), 0 0 60px rgba(255,255,255,0.07);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
      transition: background 0.3s, border-color 0.3s;
    }

    nav {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1.2rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 48px;
      width: auto;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.12)) drop-shadow(0 0 30px rgba(255,255,255,0.05)) brightness(1.1);
      transition: filter 0.3s ease;
    }

    .logo img:hover {
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.5)) brightness(1.3);
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 2.5rem;
    }

    .nav-links a {
      font-family: 'Oxanium', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      color: var(--gray-light);
      text-decoration: none;
      text-transform: uppercase;
      font-weight: 500;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .nav-links a:hover {
      color: var(--white);
      text-shadow: 0 0 12px rgba(255,255,255,0.5);
    }

    .nav-social {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .nav-social a {
      font-family: 'Oxanium', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--gray-light);
      text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .nav-social a:hover {
      color: var(--white);
      text-shadow: 0 0 10px rgba(255,255,255,0.6);
    }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 8rem 3rem 3rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    .page-label {
      font-family: 'Oxanium', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      color: var(--gray-light);
      text-transform: uppercase;
      font-weight: 400;
      margin-bottom: 0.4rem;
    }

    .page-title {
      font-family: 'Oxanium', sans-serif;
      font-size: clamp(2.5rem, 5vw, 4rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--white);
      font-weight: 800;
      text-shadow: var(--glow-sm);
    }

    /* ── GALLERY ── */
    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 3rem 6rem;
      flex: 1;
      width: 100%;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      position: relative;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
      display: flex;
      flex-direction: column;
    }

    .gallery-item:hover {
      border-color: var(--border-bright);
      box-shadow: var(--glow-sm);
      transform: translateY(-4px);
    }

    .gallery-img-wrap {
      aspect-ratio: 1/1;
      overflow: hidden;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: invert(1) brightness(0.85);
      transition: transform 0.4s ease, filter 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
      filter: invert(1) brightness(1);
    }

    .gallery-info {
      padding: 1rem 1.25rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .gallery-item h3 {
      font-family: 'Oxanium', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      color: var(--white);
      font-weight: 700;
      text-transform: uppercase;
    }

    .gallery-item-sub {
      font-family: 'Oxanium', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      color: var(--gray-light);
      text-transform: uppercase;
      font-weight: 400;
      margin-top: 0.2rem;
    }

    /* ── FOOTER ── */
    footer {
      background: #040404;
      border-top: 1px solid var(--border);
      padding: 2rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-logo {
      font-family: 'Oxanium', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      color: var(--white);
      font-weight: 800;
      text-shadow: var(--glow-sm);
    }

    .footer-copy {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--gray);
      text-transform: uppercase;
    }

    .footer-nav {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .footer-nav a {
      font-family: 'Oxanium', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--gray);
      text-decoration: none;
      text-transform: uppercase;
      font-weight: 400;
      transition: color 0.2s;
    }

    .footer-nav a:hover { color: var(--white); }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      .page-header { padding: 5rem 1.5rem 2rem; }
      .container { padding: 1.5rem 1.5rem 4rem; }
      .gallery { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
      footer { flex-direction: column; gap: 1.5rem; text-align: center; }
      .footer-nav { flex-wrap: wrap; justify-content: center; }
    }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6TRGC1VWSQ"></script>

  </script>
</head>
<body>

  <header id="site-header">
    <nav>
      <a href="../index.html" class="logo">
        <img src="../imgs/frontembossed.png" alt="PHANTOM">
      </a>
      <ul class="nav-links">
        <li><a href="../index.html#builds">Garage</a></li>
        <li><a href="../index.html#builds">Members</a></li>
        <li><a href="../index.html#reels">Media</a></li>
        <li><a href="../index.html#drop">Shop</a></li>
        <li><a href="../index.html#collective">Contact</a></li>
      </ul>
      <div class="nav-social">
        <a href="https://instagram.com/phantom.nwa" target="_blank" rel="noopener">IG</a>
        <a href="#" target="_blank" rel="noopener">TK</a>
        <a href="#" target="_blank" rel="noopener">YT</a>
      </div>
    </nav>
  </header>

  <div class="page-header">
    <p class="page-label">Shop / Stickers</p>
    <h1 class="page-title">STICKERS</h1>
  </div>

  <div class="container">
    <div class="gallery">

      <a href="bubble.html" class="gallery-item">
        <div class="gallery-img-wrap">
          <img src="../imgs/Merch/big banner.png" alt="Bubble Sticker">
        </div>
        <div class="gallery-info">
          <h3>Bubble</h3>
          <div class="gallery-item-sub">Sticker</div>
        </div>
      </a>

      
      <a href="ogshootingStar.html" class="gallery-item">
        <div class="gallery-img-wrap">
          <img src="../imgs/Merch/phantom.png" alt="OG Shooting Star Sticker">
        </div>
        <div class="gallery-info">
          <h3>OG Shooting Star</h3>
          <div class="gallery-item-sub">Sticker</div>
        </div>

      <a href="spiky.html" class="gallery-item">
        <div class="gallery-img-wrap">
          <img src="../imgs/Merch/spiky.png" alt="Spiky Sticker">
        </div>
        <div class="gallery-info">
          <h3>Spiky</h3>
          <div class="gallery-item-sub">Sticker</div>
        </div>
      </a>

    </div>
  </div>

    <footer>
        <p class="footer-copy">© 2026 Phantom Collective</p>
    </footer>

  <script>
    const header = document.getElementById('site-header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 80) {
        header.style.background = 'rgba(6,6,6,0.97)';
        header.style.backdropFilter = 'blur(12px)';
        header.style.borderBottom = '1px solid rgba(255,255,255,0.07)';
      } else {
        header.style.background = 'linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%)';
        header.style.backdropFilter = '';
        header.style.borderBottom = '';
      }
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(el => {
        if (el.isIntersecting) {
          el.target.style.opacity = '1';
          el.target.style.transform = 'translateY(0)';
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.gallery-item').forEach((el, i) => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(24px)';
      el.style.transition = `opacity 0.6s ${i * 0.1}s ease, transform 0.6s ${i * 0.1}s ease, border-color 0.3s, box-shadow 0.3s`;
      observer.observe(el);
    });
  </script>

</body>
</html>
