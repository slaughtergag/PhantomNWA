<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="imgs/favicon.png" type="image/png">
<title>Cart - PHANTOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --white: #ffffff;
        --gray: #666;
        --gray-light: #999;
        --dark: #0a0a0a;
        --card-bg: #111111;
        --border: rgba(255,255,255,0.07);
        --border-bright: rgba(255,255,255,0.18);
        --glow-sm: 0 0 12px rgba(255,255,255,0.12), 0 0 30px rgba(255,255,255,0.05);
        --glow-md: 0 0 20px rgba(255,255,255,0.18), 0 0 60px rgba(255,255,255,0.07);
    }
    html { scroll-behavior: smooth; }
    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--dark);
        color: var(--white);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ── NAV ── */
    nav {
        position: sticky; top: 0; z-index: 100;
        display: flex; align-items: center; justify-content: space-between;
        padding: 1.2rem 3rem;
        background: rgba(6,6,6,0.97);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
    }
    .nav-logo { text-decoration: none; display: flex; align-items: center; }
    .nav-logo img {
        height: 48px; width: auto;
        filter: drop-shadow(var(--glow-sm)) brightness(1.1);
        transition: filter 0.3s;
    }
    .nav-logo img:hover { filter: drop-shadow(0 0 20px rgba(255,255,255,0.5)) brightness(1.3); }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.78rem; letter-spacing: 0.18em;
        color: var(--gray-light); text-decoration: none;
        text-transform: uppercase; font-weight: 500;
        transition: color 0.2s, text-shadow 0.2s;
    }
    .nav-links a:hover { color: var(--white); text-shadow: 0 0 12px rgba(255,255,255,0.5); }
    .nav-social { display: flex; gap: 1rem; align-items: center; }
    .nav-social a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.75rem; letter-spacing: 0.1em;
        color: var(--gray-light); text-decoration: none;
        transition: color 0.2s;
    }
    .nav-social a:hover { color: var(--white); }

    /* ── PAGE HEADER ── */
    .page-header {
        max-width: 1300px; margin: 0 auto;
        padding: 4rem 3rem 2rem; width: 100%;
    }
    .page-label {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.62rem; letter-spacing: 0.35em;
        color: var(--gray-light); text-transform: uppercase;
        font-weight: 400; margin-bottom: 0.4rem;
    }
    .page-title {
        font-family: 'Oxanium', sans-serif;
        font-size: clamp(2.5rem, 5vw, 4rem);
        letter-spacing: 0.08em; line-height: 1;
        color: var(--white); font-weight: 800;
        text-shadow: var(--glow-sm);
    }

    /* ── CONTAINER ── */
    .container {
        max-width: 1300px; margin: 0 auto;
        padding: 1rem 3rem 6rem; flex: 1; width: 100%;
    }

    /* ── CART LAYOUT ── */
    .cart-layout {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 3rem;
        align-items: start;
    }

    /* ── CART ROWS ── */
    .cart-items { display: flex; flex-direction: column; }

    .cart-row {
        display: flex; gap: 1.25rem; align-items: center;
        padding: 1.5rem 0;
        border-bottom: 1px solid var(--border);
        animation: fadeUp 0.4s ease both;
    }

    .cart-thumb {
        width: 90px; height: 90px; flex-shrink: 0;
        border: 1px solid var(--border); border-radius: 3px;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    .cart-thumb img {
        width: 74px; height: 74px; object-fit: contain;
    }

    .cart-info { flex: 1; min-width: 0; }

    .cart-name {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.95rem; font-weight: 700;
        letter-spacing: 0.1em; color: var(--white);
        text-transform: uppercase; margin-bottom: 0.2rem;
    }
    .cart-color {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.6rem; letter-spacing: 0.25em;
        color: var(--gray-light); text-transform: uppercase;
        margin-bottom: 0.75rem;
    }
    .cart-qty-row {
        display: flex; align-items: center; gap: 0.5rem;
    }
    .qty-btn {
        width: 28px; height: 28px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--white); border-radius: 2px;
        cursor: pointer; font-size: 0.9rem;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.2s, border-color 0.2s;
        font-family: 'Oxanium', sans-serif;
    }
    .qty-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
    .qty-num {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.85rem; color: #ccc;
        min-width: 20px; text-align: center;
    }
    .remove-btn {
        background: none; border: none;
        font-family: 'Oxanium', sans-serif;
        font-size: 0.58rem; letter-spacing: 0.2em;
        text-transform: uppercase; color: #444;
        cursor: pointer; margin-left: 0.5rem;
        transition: color 0.2s;
    }
    .remove-btn:hover { color: var(--white); }

    .cart-price {
        font-family: 'Oxanium', sans-serif;
        font-size: 1rem; font-weight: 700;
        color: var(--white); flex-shrink: 0;
    }

    /* ── SUMMARY ── */
    .cart-summary {
        background: #111;
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1.75rem;
        position: sticky;
        top: 6rem;
    }
    .summary-label {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.62rem; letter-spacing: 0.35em;
        color: var(--gray-light); text-transform: uppercase;
        font-weight: 400; margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
    }
    .summary-rows { margin-bottom: 1rem; }
    .summary-row {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.75rem; letter-spacing: 0.08em;
        color: var(--gray-light); text-transform: uppercase;
        display: flex; justify-content: space-between;
        padding: 0.4rem 0;
    }
    .summary-total {
        font-family: 'Oxanium', sans-serif;
        font-size: 1.1rem; font-weight: 800;
        letter-spacing: 0.06em; color: var(--white);
        display: flex; justify-content: space-between;
        align-items: baseline;
        padding: 1rem 0;
        border-top: 1px solid var(--border);
        margin-bottom: 1.25rem;
        text-shadow: var(--glow-sm);
    }
    .summary-note {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.58rem; letter-spacing: 0.18em;
        color: #444; text-transform: uppercase;
        margin-bottom: 1rem; line-height: 1.8;
    }
    .checkout-links { display: flex; flex-direction: column; gap: 0.6rem; }
    .btn-checkout {
        display: block; text-align: center;
        font-family: 'Oxanium', sans-serif;
        font-size: 0.72rem; letter-spacing: 0.12em;
        text-transform: uppercase; font-weight: 400;
        padding: 0.8rem 1rem; text-decoration: none;
        border: 1.5px solid rgba(255,255,255,0.4);
        color: var(--white); border-radius: 2px;
        transition: all 0.25s;
    }
    .btn-checkout:hover {
        background: var(--white); color: #000;
        border-color: var(--white);
        box-shadow: var(--glow-md);
    }

    /* ── FOOTER ── */
    footer {
        background: #040404;
        border-top: 1px solid var(--border);
        padding: 2rem 3rem; text-align: center;
    }
    .footer-copy {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.6rem; letter-spacing: 0.15em;
        color: var(--gray); text-transform: uppercase;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
        .cart-layout { grid-template-columns: 1fr; }
        .cart-summary { position: static; }
    }
    @media (max-width: 768px) {
        nav { padding: 1rem 1.5rem; }
        .nav-links { display: none; }
        .page-header { padding: 3rem 1.5rem 1.5rem; }
        .container { padding: 1rem 1.5rem 4rem; }
        footer { padding: 1.5rem; }
    }
</style>
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo"><img src="imgs/frontembossed.png" alt="PHANTOM"></a>
    <ul class="nav-links">
        <li><a href="index.html#builds">Garage</a></li>
        <li><a href="index.html#builds">Members</a></li>
        <li><a href="index.html#reels">Media</a></li>
        <li><a href="index.html#drop">Shop</a></li>
        <li><a href="index.html#collective">Contact</a></li>
    </ul>
    <div class="nav-social">
        <a href="https://instagram.com/phantom.nwa" target="_blank" rel="noopener">IG</a>
        <a href="#" target="_blank" rel="noopener">TK</a>
        <a href="#" target="_blank" rel="noopener">YT</a>
    </div>
</nav>

<div class="page-header">
    <p class="page-label">Phantom</p>
    <h1 class="page-title">CART</h1>
</div>

<div class="container">
    <div id="cart-root"></div>
</div>

<footer>
    <p class="footer-copy">© 2026 Phantom Collective</p>
</footer>

<script src="cart.js"></script>
</body>
</html>
