<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHANTOM</title>
<link rel="icon" type="image/png" href="imgs/favicon.png">
<link rel="apple-touch-icon" href="imgs/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --white: #ffffff;
        --gray-light: #999;
        --gray: #666;
        --dark: #0a0a0a;
    }

    html, body {
        height: 100%;
    }

    body {
        font-family: 'DM Sans', sans-serif;
        background: #050505;
        color: var(--white);
        overflow: hidden;
    }

    /* ── BACKDROP ── */
    .bg {
        position: fixed;
        inset: 0;
        background-image: url('imgs/background.png');
        background-size: cover;
        background-position: center;
        opacity: 0.25;
        filter: brightness(0.4) contrast(1.2) grayscale(0.3);
    }

    .bg::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 75%);
    }

    /* Slow ambient light drifting behind the logo. Kept intentionally
       small (not full-viewport) so the browser only has a small area to
       repaint each frame — full-screen animated gradients are one of the
       most common causes of janky animation. */
    .ambient-light {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 700px;
        height: 700px;
        margin: -350px 0 0 -350px;
        pointer-events: none;
        background: radial-gradient(circle, rgba(255,255,255,0.07) 0%, transparent 60%);
        animation: drift 24s ease-in-out infinite;
        transform: translateZ(0);
        will-change: transform, opacity;
    }

    @keyframes drift {
        0%, 100% { transform: translateZ(0) scale(1);    opacity: 0.7; }
        50%      { transform: translateZ(0) scale(1.12); opacity: 1;   }
    }

    /* ── CENTER STAGE ── */
    .stage {
        position: relative;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        gap: 4.5rem;
    }

    /* Logo floats very gently, on its own GPU layer so it never has to
       wait on anything else painting. */
    .logo {
        width: clamp(220px, 34vw, 420px);
        height: auto;
        filter: drop-shadow(0 0 30px rgba(255,255,255,0.15)) drop-shadow(0 0 80px rgba(255,255,255,0.06));
        animation: float 9s ease-in-out infinite;
        transform: translateZ(0);
        will-change: transform;
    }

    @keyframes float {
        0%, 100% { transform: translateZ(0) translateY(0); }
        50%      { transform: translateZ(0) translateY(-8px); }
    }

    /* ── COUNTDOWN ── */
    .countdown {
        display: flex;
        gap: clamp(1.5rem, 5vw, 3.5rem);
    }

    .unit {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
    }

    .unit-value {
        font-family: 'Oxanium', sans-serif;
        font-weight: 700;
        font-size: clamp(1.8rem, 5vw, 3.2rem);
        line-height: 1;
        min-width: 1.6em;
        color: var(--white);
        text-shadow: 0 0 12px rgba(255,255,255,0.18);
    }

    .unit-label {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.62rem;
        letter-spacing: 0.3em;
        color: var(--gray-light);
        font-weight: 400;
    }

    .divider {
        font-family: 'Oxanium', sans-serif;
        font-weight: 300;
        font-size: clamp(1.4rem, 4vw, 2.4rem);
        color: rgba(255,255,255,0.15);
        align-self: flex-start;
        margin-top: 0.1em;
    }

    .until {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.35em;
        color: var(--gray);
        font-weight: 400;
    }

    @media (prefers-reduced-motion: reduce) {
        .logo, .ambient-light { animation: none; }
    }

    @media (max-width: 480px) {
        .divider { display: none; }
        .countdown { gap: 1.4rem; }
    }
</style>
</head>
<body>

<div class="bg"></div>
<div class="ambient-light"></div>

<div class="stage">
    <img src="imgs/frontembossed.png" alt="PHANTOM" class="logo">

    <div>
        <div class="countdown" id="countdown">
            <div class="unit"><span class="unit-value" id="days">00</span><span class="unit-label">Days</span></div>
            <span class="divider">:</span>
            <div class="unit"><span class="unit-value" id="hours">00</span><span class="unit-label">Hrs</span></div>
            <span class="divider">:</span>
            <div class="unit"><span class="unit-value" id="minutes">00</span><span class="unit-label">Min</span></div>
            <span class="divider">:</span>
            <div class="unit"><span class="unit-value" id="seconds">00</span><span class="unit-label">Sec</span></div>
        </div>
    </div>
</div>

<script>
    // Thursday, Sept 24, 2026, midnight Central Time (CDT, UTC-5 in September).
    // Written as a fixed UTC instant so everyone worldwide hits zero at the
    // same real-world moment, regardless of their own timezone.
    const target = Date.UTC(2026, 8, 25, 4, 59, 0);

    const daysEl    = document.getElementById('days');
    const hoursEl   = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
        const diff = target - Date.now();

        if (diff <= 0) {
            daysEl.textContent = hoursEl.textContent = minutesEl.textContent = secondsEl.textContent = '00';
            document.querySelector('.until').textContent = "It's here.";
            clearInterval(timer);
            return;
        }

        const days    = Math.floor(diff / 86400000);
        const hours   = Math.floor((diff % 86400000) / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);

        daysEl.textContent    = pad(days);
        hoursEl.textContent   = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);
    }

    tick();
    const timer = setInterval(tick, 1000);
</script>

</body>
</html>
