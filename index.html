<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --white: #ffffff;
        --gray-light: #999;
        --gray: #666;
        --black: #000000;
        --border: rgba(255,255,255,0.07);
        --glow-sm: 0 0 12px rgba(255,255,255,0.12), 0 0 30px rgba(255,255,255,0.05);
    }

    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--black);
        color: var(--white);
    }

    a { color: inherit; text-decoration: none; }

    /* ── INTRO ANIMATION ── */
    body.intro-active { overflow: hidden; height: 100vh; }

    #intro-overlay {
        position: fixed; inset: 0; z-index: 9999;
        pointer-events: none;
    }
    #intro-overlay .curtain {
        position: absolute; top: 0; bottom: 0;
        width: 50vw;
        background: #000;
        transition: transform 0.85s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.85s ease;
    }
    #intro-overlay .curtain-left  { left: 0; transform-origin: left; }
    #intro-overlay .curtain-right { right: 0; transform-origin: right; }

    #intro-overlay.opening .curtain-left  { transform: translateX(-100%); opacity: 0; }
    #intro-overlay.opening .curtain-right { transform: translateX(100%); opacity: 0; }

    #intro-sticker {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: min(340px, 65vw);
        z-index: 2;
        opacity: 0;
        animation: introGlitch 1.3s steps(1, end) forwards;
    }
    #intro-overlay.opening #intro-sticker {
        transition: opacity 0.4s ease;
        opacity: 0 !important;
    }

    @keyframes introGlitch {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.94); filter: none; }
        4%   { opacity: 1; transform: translate(calc(-50% - 4px), calc(-50% + 2px)); filter: drop-shadow(3px 0 #ff2a4d) drop-shadow(-3px 0 #2ad8ff); }
        8%   { transform: translate(calc(-50% + 3px), calc(-50% - 2px)); }
        12%  { opacity: 0.35; }
        16%  { opacity: 1; transform: translate(calc(-50% - 5px), -50%); filter: drop-shadow(-3px 0 #ff2a4d) drop-shadow(3px 0 #2ad8ff); }
        20%  { transform: translate(-50%, calc(-50% + 3px)); }
        26%  { opacity: 0.2; filter: none; }
        30%  { opacity: 1; transform: translate(calc(-50% + 4px), calc(-50% - 3px)); filter: drop-shadow(2px 0 #ff2a4d) drop-shadow(-2px 0 #2ad8ff); }
        36%  { transform: translate(-50%, -50%); filter: none; }
        44%  { opacity: 0.5; }
        50%  { opacity: 1; transform: translate(calc(-50% - 3px), calc(-50% + 2px)); filter: drop-shadow(-2px 0 #ff2a4d) drop-shadow(2px 0 #2ad8ff); }
        58%  { transform: translate(-50%, -50%); filter: none; }
        68%  { opacity: 0.65; }
        76%  { opacity: 1; transform: translate(calc(-50% + 2px), -50%); filter: drop-shadow(1px 0 #ff2a4d) drop-shadow(-1px 0 #2ad8ff); }
        84%  { transform: translate(-50%, -50%); filter: none; }
        100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: none; }
    }

    @media (prefers-reduced-motion: reduce) {
        #intro-sticker { animation: none; opacity: 1; }
        #intro-overlay .curtain { transition: opacity 0.5s ease; }
        #intro-overlay.opening .curtain-left,
        #intro-overlay.opening .curtain-right { transform: none; }
    }

    /* ── NAV (from base template) ── */
    nav {
        position: sticky; top: 0; z-index: 100;
        display: flex; align-items: center; justify-content: space-between;
        padding: 1.2rem 3rem;
        background: rgba(6,6,6,0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
    }
    .nav-logo { text-decoration: none; display: flex; align-items: center; }
    .nav-logo img {
        height: 48px; width: auto;
        filter: drop-shadow(var(--glow-sm)) brightness(1.1);
        transition: filter 0.3s ease;
    }
    .nav-logo img:hover { filter: drop-shadow(0 0 20px rgba(255,255,255,0.5)) brightness(1.3); }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.78rem; letter-spacing: 0.18em;
        color: var(--gray-light); text-decoration: none;
        text-transform: uppercase; font-weight: 500;
        transition: color 0.2s, text-shadow 0.2s;
    }
    .nav-links a:hover { color: var(--white); text-shadow: 0 0 12px rgba(255,255,255,0.5); }
    .nav-social { display: flex; gap: 1rem; align-items: center; }
    .nav-social a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.75rem; font-weight: 400; letter-spacing: 0.1em;
        color: var(--gray-light); text-decoration: none;
        transition: color 0.2s, text-shadow 0.2s;
        display: flex; align-items: center;
    }
    .nav-social a:hover { color: var(--white); text-shadow: 0 0 10px rgba(255,255,255,0.6); }
    .cart-link svg {
        width: 20px; height: 20px;
        fill: none; stroke: currentColor; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── SECTION SHELL ── */
    section { padding: 2.5rem 1.5rem; border-bottom: 1px solid var(--border); }

    .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        max-width: 1400px;
        margin: 0 auto 1rem;
    }

    .section-title {
        font-family: 'Oxanium', sans-serif;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
    }

    .section-link {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gray-light);
        font-weight: 700;
    }

    .section-link:hover { color: var(--white); }

    /* ── DROP ── */
    .drop-inner {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        align-items: center;
    }

    .drop-images {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--border);
        border: 1px solid var(--border);
    }

    .drop-img {
        aspect-ratio: 3 / 4;
        background: #111;
        overflow: hidden;
    }

    .drop-img img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .drop-name {
        font-family: 'Oxanium', sans-serif;
        font-weight: 800;
        font-size: clamp(2.2rem, 4vw, 3.5rem);
        line-height: 0.95;
        text-transform: uppercase;
        margin-bottom: 1rem;
    }

    .btn-shop {
        display: inline-block;
        font-family: 'Oxanium', sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
        padding: 0.75rem 2rem;
        border: 1.5px solid var(--white);
    }

    .btn-shop:hover { background: var(--white); color: var(--black); }

    /* ── COLLECTIVE ── */
    .collective-inner {
        max-width: 800px;
        margin: 0 auto;
        text-align: center;
        padding: 1rem 0;
    }

    .collective-manifesto {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gray-light);
        margin-bottom: 1.5rem;
    }

    .btn-join {
        display: inline-block;
        font-family: 'Oxanium', sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
        padding: 0.75rem 2rem;
        border: 1.5px solid var(--border);
    }

    .btn-join:hover { border-color: var(--white); }

    /* ── FOOTER (base template style, with legal links kept) ── */
    footer {
        background: #040404;
        border-top: 1px solid var(--border);
        padding: 2rem 3rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
    }
    .footer-copy {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.6rem; letter-spacing: 0.15em;
        color: var(--gray); text-transform: uppercase; font-weight: 300;
    }
    .footer-legal {
        display: flex;
        gap: 1.25rem;
        list-style: none;
    }
    .footer-legal a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        color: var(--gray);
        text-transform: uppercase;
        transition: color 0.2s;
    }
    .footer-legal a:hover { color: var(--white); }

    /* ── RESPONSIVE ── */
    @media (max-width: 1024px) {
        .drop-inner { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
        nav { padding: 1rem 1.5rem; }
        .nav-links { display: none; }
    }

    @media (max-width: 640px) {
        footer { flex-direction: column; text-align: center; }
    }
</style>
</head>
<body>

<div id="intro-overlay">
    <div class="curtain curtain-left"></div>

    <img id="intro-sticker" src="imgs/Merch/Drop2/Sticker/sigil.png" alt="">
</div>

<script>
    // Play the glitch/curtain intro once per browser session, only on this landing page.
    (function () {
        if (sessionStorage.getItem('phantom_intro_seen')) {
            const overlay = document.getElementById('intro-overlay');
            if (overlay) overlay.remove();
            return;
        }
        sessionStorage.setItem('phantom_intro_seen', '1');
        document.body.classList.add('intro-active');

        const overlay = document.getElementById('intro-overlay');

        setTimeout(() => {
            overlay.classList.add('opening');
            document.body.classList.remove('intro-active');
            setTimeout(() => overlay.remove(), 900);
        }, 1300);
    })();
</script>

<script>
    // Detect touch device (iOS, Android)
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    document.querySelectorAll('.reels-grid video').forEach(video => {
        video.muted = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
    });

    if (!isTouchDevice) {
        document.querySelectorAll('.reels-grid .card').forEach(card => {
            const video = card.querySelector('video');
            if (!video) return;
            card.addEventListener('mouseenter', () => video.play().catch(() => {}));
            card.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
        });
    } else {
        const videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const card = entry.target;
                const video = card.querySelector('video');
                const img = card.querySelector('img');
                if (!video) return;
                if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                    video.play().catch(() => {});
                    if (img) img.style.opacity = '0';
                } else {
                    video.pause();
                    video.currentTime = 0;
                    if (img) img.style.opacity = '1';
                }
            });
        }, { threshold: 0.5 });

        document.querySelectorAll('.reels-grid .card').forEach(card => videoObserver.observe(card));
    }

    // Graceful fallback if an image is missing
    document.querySelectorAll('img').forEach(img => {
        img.addEventListener('error', () => {
            img.style.display = 'none';
        });
    });
</script>
