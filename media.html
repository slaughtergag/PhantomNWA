<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="../imgs/favicon.png" type="image/png">
<title>Media - PHANTOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --white: #ffffff;
        --off-white: #c8c8c8;
        --gray: #666;
        --gray-light: #999;
        --dark: #0a0a0a;
        --border: rgba(255,255,255,0.07);
        --glow-sm: 0 0 12px rgba(255,255,255,0.12), 0 0 30px rgba(255,255,255,0.05);
        --glow-md: 0 0 20px rgba(255,255,255,0.18), 0 0 60px rgba(255,255,255,0.07);
    }
    html, body { height: 100%; overflow: hidden; }
    html { scroll-behavior: smooth; }
    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--dark);
        color: var(--white);
        display: flex;
        flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* NAV */
    nav {
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: 1rem 3rem;
        padding-top: calc(1rem + env(safe-area-inset-top, 0px));
        background: rgba(6,6,6,0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
    }
    .nav-logo { text-decoration: none; display: flex; align-items: center; }
    .nav-logo img {
        height: 40px; width: auto;
        filter: drop-shadow(var(--glow-sm)) brightness(1.1);
        transition: filter 0.3s ease;
    }
    .nav-logo img:hover { filter: drop-shadow(0 0 20px rgba(255,255,255,0.5)) brightness(1.3); }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.78rem; letter-spacing: 0.18em;
        color: var(--gray-light); text-decoration: none;
        text-transform: uppercase; font-weight: 500;
        transition: color 0.2s, text-shadow 0.2s;
    }
    .nav-links a:hover { color: var(--white); text-shadow: 0 0 12px rgba(255,255,255,0.5); }
    .nav-social { display: flex; gap: 1rem; align-items: center; }
    .nav-social a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.75rem; font-weight: 400; letter-spacing: 0.1em;
        color: var(--gray-light); text-decoration: none;
        transition: color 0.2s, text-shadow 0.2s;
    }
    .nav-social a:hover { color: var(--white); text-shadow: 0 0 10px rgba(255,255,255,0.6); }

    /* HEADER — compact, single block */
    .media-header {
        flex-shrink: 0;
        max-width: 1300px;
        margin: 0 auto;
        width: 100%;
        padding: clamp(0.9rem, 2.2vw, 1.5rem) clamp(1.5rem, 4vw, 3rem) 0.75rem;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1.5rem;
        flex-wrap: wrap;
    }
    .media-title-block { display: flex; align-items: baseline; gap: 0.9rem; flex-wrap: wrap; }
    .section-label {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.6rem; letter-spacing: 0.3em;
        color: var(--gray-light); text-transform: uppercase;
        font-weight: 400;
    }
    .media-title {
        font-family: 'Oxanium', sans-serif; font-weight: 800;
        font-size: clamp(1.3rem, 2.6vw, 1.9rem);
        letter-spacing: 0.06em; line-height: 1;
        color: var(--white); text-shadow: var(--glow-sm);
        text-transform: uppercase;
    }
    .media-thanks {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.78rem;
        line-height: 1.5;
        color: var(--off-white);
        font-weight: 300;
        max-width: 480px;
        text-align: right;
    }
    .media-thanks strong { color: var(--white); font-weight: 500; }

    /* GALLERY — fills remaining height, scrolls sideways only */
    .gallery-wrap {
        flex: 1;
        min-height: 0;
        position: relative;
        display: flex;
        align-items: center;
    }
    .photo-scroll {
        flex: 1;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 1rem;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x proximity;
        -webkit-overflow-scrolling: touch;
        padding: 0.5rem clamp(1.5rem, 4vw, 3rem);
        scrollbar-width: none;
    }
    .photo-scroll::-webkit-scrollbar { display: none; }

    .photo-card {
        flex: 0 0 auto;
        height: 100%;
        width: clamp(200px, 26vw, 320px);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
        scroll-snap-align: center;
        display: block;
    }
    .photo-card.wide { width: clamp(320px, 42vw, 560px); }

    .photo-card img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
        filter: brightness(0.88);
        transition: transform 0.4s ease, filter 0.3s ease;
    }
    .photo-card:hover img { transform: scale(1.03); filter: brightness(1); }

    /* scroll arrows */
    .scroll-btn {
        position: absolute; top: 50%; transform: translateY(-50%);
        z-index: 5;
        width: 42px; height: 42px;
        background: rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.15);
        color: var(--white);
        border-radius: 2px;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(4px);
        transition: background 0.2s, border-color 0.2s;
    }
    .scroll-btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.4); }
    .scroll-btn svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .scroll-btn.prev { left: 0.75rem; }
    .scroll-btn.next { right: 0.75rem; }

    /* FOOTER */
    footer {
        flex-shrink: 0;
        background: #040404;
        border-top: 1px solid var(--border);
        padding: 0.85rem 3rem;
        padding-bottom: calc(0.85rem + env(safe-area-inset-bottom, 0px));
        text-align: center;
    }
    .footer-copy {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.58rem; letter-spacing: 0.15em;
        color: var(--gray); text-transform: uppercase; font-weight: 300;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        nav { padding: 0.85rem 1.25rem; padding-top: calc(0.85rem + env(safe-area-inset-top, 0px)); }
        .nav-links { display: none; }
        .media-header { flex-direction: column; align-items: flex-start; gap: 0.4rem; padding: 0.75rem 1.25rem 0.6rem; }
        .media-thanks { text-align: left; max-width: 100%; font-size: 0.72rem; }
        .scroll-btn { display: none; }
        .photo-card { width: 68vw; }
        .photo-card.wide { width: 82vw; }
    }
</style>
</head>
<body>

<!-- NAV -->
<nav>
    <a href="index.html" class="nav-logo"><img src="imgs/frontembossed.png" alt="PHANTOM"></a>
    <ul class="nav-links">
        <li><a href="media.html">Media</a></li>
        <li><a href="merchList.html">Shop</a></li>
        <li><a href="index.html">Contact</a></li>
    </ul>
    <div class="nav-social">
        <a href="https://instagram.com/phantom.nwa" target="_blank" rel="noopener">IG</a>
    </div>
</nav>

<!-- HEADER -->
<div class="media-header">
    <div class="media-title-block">
        <span class="section-label">Phantom / Drop 02</span>
        <h1 class="media-title">Behind The Drop</h1>
    </div>
    <p class="media-thanks">
        Thank you for supporting Phantom... Here are some shots from the drop. Tag us on Instagram <strong>@phantomnwa</strong> to be featured.
    </p>
</div>

<!-- GALLERY -->
<div class="gallery-wrap">
    <button class="scroll-btn prev" id="scrollPrev" aria-label="Scroll left">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div class="photo-scroll" id="photoScroll">
        <a class="photo-card wide" target="_blank" rel="noopener">
            <img src="../imgs/Merch/Drop2/Hoodies/Sunset.JPG" alt="Phantom hoodie at sunset">
        </a>
        <a class="photo-card wide" target="_blank" rel="noopener">
            <img src="../imgs/Merch/Drop2/Hoodies/NoelFront.JPG" alt="Phantom hoodie front shot">
        </a>
        <a class="photo-card wide" target="_blank" rel="noopener">
            <img src="../imgs/Merch/Drop2/collective_banner.JPG" alt="Phantom hoodie on banner">
        </a>
        <a class="photo-card wide" target="_blank" rel="noopener">
            <img src="../imgs/Merch/Drop2/collective_noel.JPG" alt="Phantom hoodie on Noel">
        </a>
        <a class="photo-card wide" target="_blank" rel="noopener">
            <img src="../imgs/Merch/Drop2/collective_charlie.JPG" alt="Phantom hoodie on Charlie">
        </a>
        <a class="photo-card wide" target="_blank" rel="noopener">
            <img src="../imgs/Merch/Drop2/collective_gage.JPG" alt="Phantom hoodie back shot">
        </a>
        <a class="photo-card wide" target="_blank" rel="noopener">
            <img src="../imgs/Merch/Drop2/Hoodies/GageBack.JPG" alt="Phantom hoodie back shot">
        </a>
        
    </div>

    <button class="scroll-btn next" id="scrollNext" aria-label="Scroll right">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
</div>

<!-- FOOTER -->
<footer>
    <p class="footer-copy">© 2026 Phantom Collective</p>
</footer>

<script>
    document.querySelectorAll('img').forEach(img => {
        img.addEventListener('error', () => {
            img.closest('.photo-card')?.remove();
        });
    });

    const scroller = document.getElementById('photoScroll');
    const prevBtn = document.getElementById('scrollPrev');
    const nextBtn = document.getElementById('scrollNext');

    function scrollByAmount(dir) {
        scroller.scrollBy({ left: dir * (scroller.clientWidth * 0.7), behavior: 'smooth' });
    }
    prevBtn.addEventListener('click', () => scrollByAmount(-1));
    nextBtn.addEventListener('click', () => scrollByAmount(1));

    // Let a plain vertical mouse wheel/trackpad scroll move the gallery horizontally
    scroller.addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            e.preventDefault();
            scroller.scrollLeft += e.deltaY;
        }
    }, { passive: false });

    function updateArrowVisibility() {
        prevBtn.style.opacity = scroller.scrollLeft <= 4 ? '0.3' : '1';
        prevBtn.style.pointerEvents = scroller.scrollLeft <= 4 ? 'none' : 'auto';
        const atEnd = scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 4;
        nextBtn.style.opacity = atEnd ? '0.3' : '1';
        nextBtn.style.pointerEvents = atEnd ? 'none' : 'auto';
    }
    scroller.addEventListener('scroll', updateArrowVisibility);
    window.addEventListener('resize', updateArrowVisibility);
    updateArrowVisibility();
</script>

</body>
</html>
