<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../imgs/favicon.png" type="image/png">
<title>Spiky Logo - PHANTOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --white: #ffffff;
        --off-white: #c8c8c8;
        --gray: #666;
        --gray-light: #999;
        --dark: #0a0a0a;
        --darker: #060606;
        --card-bg: #111111;
        --border: rgba(255,255,255,0.07);
        --border-bright: rgba(255,255,255,0.18);
        --glow-sm: 0 0 12px rgba(255,255,255,0.12), 0 0 30px rgba(255,255,255,0.05);
        --glow-md: 0 0 20px rgba(255,255,255,0.18), 0 0 60px rgba(255,255,255,0.07);
        --glow-lg: 0 0 30px rgba(255,255,255,0.25), 0 0 80px rgba(255,255,255,0.1);
    }

    html { scroll-behavior: smooth; }

    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--dark);
        color: var(--white);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ── NAV ── */
    nav {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.2rem 3rem;
        background: rgba(6,6,6,0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
    }

    .nav-logo {
        text-decoration: none;
        display: flex;
        align-items: center;
    }

    .nav-logo img {
        height: 48px;
        width: auto;
        filter: drop-shadow(var(--glow-sm)) brightness(1.1);
        transition: filter 0.3s ease;
    }

    .nav-logo img:hover {
        filter: drop-shadow(0 0 20px rgba(255,255,255,0.5)) brightness(1.3);
    }

    .nav-links {
        display: flex;
        gap: 2.5rem;
        list-style: none;
    }

    .nav-links a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        color: var(--gray-light);
        text-decoration: none;
        text-transform: uppercase;
        font-weight: 500;
        transition: color 0.2s, text-shadow 0.2s;
    }

    .nav-links a:hover {
        color: var(--white);
        text-shadow: 0 0 12px rgba(255,255,255,0.5);
    }

    .nav-social {
        display: flex;
        gap: 1rem;
        align-items: center;
    }

    .nav-social a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.75rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        color: var(--gray-light);
        text-decoration: none;
        transition: color 0.2s, text-shadow 0.2s;
    }

    .nav-social a:hover {
        color: var(--white);
        text-shadow: 0 0 10px rgba(255,255,255,0.6);
    }

    /* ── CONTAINER ── */
    .container {
        max-width: 1300px;
        margin: 0 auto;
        padding: 5rem 3rem;
        flex: 1;
        width: 100%;
    }

    .section-label {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.62rem;
        letter-spacing: 0.35em;
        color: var(--gray-light);
        text-transform: uppercase;
        margin-bottom: 0.4rem;
        font-weight: 400;
        text-align: center;
    }

    .section-title {
        font-family: 'Oxanium', sans-serif;
        font-weight: 800;
        font-size: clamp(1.8rem, 3.5vw, 2.8rem);
        letter-spacing: 0.08em;
        line-height: 1.1;
        color: var(--white);
        text-shadow: var(--glow-md);
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 3.5rem;
    }

    /* ── PRODUCT ── */
    .product-content {
        display: flex;
        gap: 4rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
    }

    .product-image {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1.5rem;
        transition: border-color 0.3s, box-shadow 0.3s;
    }

    .product-image:hover {
        border-color: var(--border-bright);
        box-shadow: var(--glow-sm);
    }

    .product-image img {
        display: block;
        max-width: 400px;
        width: 100%;
        height: auto;
        filter: invert(1);
        transition: transform 0.4s ease;
    }

    .product-image:hover img {
        transform: scale(1.04);
    }

    .product-details {
        max-width: 380px;
    }

    .product-price {
        font-family: 'Oxanium', sans-serif;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        margin-bottom: 1.25rem;
        text-shadow: var(--glow-sm);
    }

    .product-description {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        color: var(--gray-light);
        text-transform: uppercase;
        line-height: 2;
        margin-bottom: 2rem;
        font-weight: 400;
    }

    .product-buttons {
        text-align: center;
    }

    .btn-shop {
        display: inline-block;
        font-family: 'Oxanium', sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 400;
        padding: 0.85rem 2.5rem;
        width: 220px;
        text-align: center;
        text-decoration: none;
        border: 1.5px solid rgba(255,255,255,0.5);
        color: var(--white);
        border-radius: 2px;
        transition: all 0.25s;
        box-sizing: border-box;
    }

    .btn-shop:hover {
        background: var(--white);
        color: #000;
        border-color: var(--white);
        box-shadow: var(--glow-md);
    }

    /* ── FOOTER ── */
    footer {
        background: #040404;
        border-top: 1px solid var(--border);
        padding: 2rem 3rem;
        text-align: center;
    }

    .footer-copy {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.6rem;
        letter-spacing: 0.15em;
        color: var(--gray);
        text-transform: uppercase;
        font-weight: 300;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
        nav { padding: 1rem 1.5rem; }
        .nav-links { display: none; }
        .container { padding: 3rem 1.5rem; }
        .product-content { gap: 2rem; }
        .btn-shop { width: 100%; }
    }
</style>
</head>
<body>

<!-- ── NAV ── -->
<nav>
    <a href="../index.html" class="nav-logo"><img src="../imgs/frontembossed.png" alt="PHANTOM"></a>
    <ul class="nav-links">
        <li><a href="../index.html#builds">Garage</a></li>
        <li><a href="../index.html#builds">Members</a></li>
        <li><a href="../index.html#reels">Media</a></li>
        <li><a href="../index.html#drop">Shop</a></li>
        <li><a href="../index.html#collective">Contact</a></li>
    </ul>
    <div class="nav-social">
        <a href="https://instagram.com/phantom.nwa" target="_blank" rel="noopener">IG</a>
        <a href="#" target="_blank" rel="noopener">TK</a>
        <a href="#" target="_blank" rel="noopener">YT</a>
    </div>
</nav>

<!-- ── PRODUCT ── -->
<section class="container">
    <p class="section-label">Phantom Merch</p>
    <h2 class="section-title">Spiky Logo Sticker</h2>
    <div class="product-content">

        <div class="product-image">
            <img src="../imgs/Merch/spiky.png" alt="Spiky Sticker">
        </div>

        <div class="product-details">
            <p class="product-price">$15.00</p>
            <p class="product-description">
                12in x 6in (LxW)<br>
                Note: All purchases are made to order. Please allow up to 2 weeks to receive your product.
            </p>

            <div class="product-buttons">
                <a href="https://square.link/u/12RLUXal" target="_blank" class="btn-shop">Buy Now</a>
            </div>
        </div>

    </div>
</section>

<!-- ── FOOTER ── -->
<footer>
    <p class="footer-copy">© 2026 Phantom Collective</p>
</footer>

</body>
</html>
