<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="../imgs/favicon.png" type="image/png">
<title>Shooting Star Tee - PHANTOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --white: #ffffff;
        --off-white: #c8c8c8;
        --gray: #666;
        --gray-light: #999;
        --dark: #0a0a0a;
        --card-bg: #111111;
        --border: rgba(255,255,255,0.07);
        --border-bright: rgba(255,255,255,0.18);
        --glow-sm: 0 0 12px rgba(255,255,255,0.12), 0 0 30px rgba(255,255,255,0.05);
        --glow-md: 0 0 20px rgba(255,255,255,0.18), 0 0 60px rgba(255,255,255,0.07);
    }
    html { scroll-behavior: smooth; }
    body {
        font-family: 'DM Sans', sans-serif;
        background: var(--dark);
        color: var(--white);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* NAV */
    nav {
        position: sticky; top: 0; z-index: 100;
        display: flex; align-items: center; justify-content: space-between;
        padding: 1.2rem 3rem;
        padding-top: calc(1.2rem + env(safe-area-inset-top, 0px));
        background: rgba(6,6,6,0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
    }
    .nav-logo { text-decoration: none; display: flex; align-items: center; }
    .nav-logo img {
        height: 48px; width: auto;
        filter: drop-shadow(var(--glow-sm)) brightness(1.1);
        transition: filter 0.3s ease;
    }
    .nav-logo img:hover { filter: drop-shadow(0 0 20px rgba(255,255,255,0.5)) brightness(1.3); }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.78rem; letter-spacing: 0.18em;
        color: var(--gray-light); text-decoration: none;
        text-transform: uppercase; font-weight: 500;
        transition: color 0.2s, text-shadow 0.2s;
    }
    .nav-links a:hover { color: var(--white); text-shadow: 0 0 12px rgba(255,255,255,0.5); }
    .nav-social { display: flex; gap: 1rem; align-items: center; }
    .nav-social a {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.75rem; font-weight: 400; letter-spacing: 0.1em;
        color: var(--gray-light); text-decoration: none;
        transition: color 0.2s, text-shadow 0.2s;
    }
    .nav-social a:hover { color: var(--white); text-shadow: 0 0 10px rgba(255,255,255,0.6); }

    /* CONTAINER */
    .container {
        max-width: 1300px; margin: 0 auto;
        padding: clamp(2rem, 5vw, 4rem) clamp(1.5rem, 4vw, 3rem);
        flex: 1; width: 100%;
    }
    .section-label {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.62rem; letter-spacing: 0.35em;
        color: var(--gray-light); text-transform: uppercase;
        margin-bottom: 0.4rem; font-weight: 400; text-align: center;
    }
    .section-title {
        font-family: 'Oxanium', sans-serif; font-weight: 800;
        font-size: clamp(1.8rem, 3.5vw, 2.8rem);
        letter-spacing: 0.08em; line-height: 1.1;
        color: var(--white); text-shadow: var(--glow-md);
        text-align: center; text-transform: uppercase; margin-bottom: 2rem;
    }

    /* PRODUCT LAYOUT */
    .product-content {
        display: flex; gap: 4rem;
        flex-wrap: wrap; align-items: flex-start; justify-content: center;
    }

    /* CAROUSEL */
    .carousel-wrap { position: relative; width: 100%; max-width: 280px; }

    .product-image {
        background: var(--dark);
        border: none;
        border-radius: 3px;
        overflow: hidden;
        transition: box-shadow 0.3s, background 0.4s;
        position: relative;
    }
    .product-image:hover {
        box-shadow: var(--glow-sm);
    }

    /* slides */
    .slides {
        display: flex;
        transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
    }

    .slide {
        min-width: 100%;
        aspect-ratio: 2 / 3;
        max-height: 55vh;
        padding: 0;
        display: flex; align-items: center; justify-content: center;
    }

    .slide img {
        display: block;
        width: 100%; height: 100%;
        object-fit: cover;
        object-position: center;
        transition: filter 0.35s ease;
    }

    /* main product shot: show the whole transparent PNG instead of cropping it */
    .slide:first-child img {
        object-fit: contain;
    }

    /* life shots: no filter change on hover only */
    .slide.life-shot img {
        filter: brightness(0.85) grayscale(0.1) !important;
    }
    .slide.life-shot:hover img { filter: brightness(1) grayscale(0) !important; }

    /* black variant overrides for product slide only */
    .product-image.variant-black .slide:first-child { background: #e8e8e8; }
    .product-image.variant-black .slide:first-child img { filter: invert(0) brightness(0.9); }

    /* arrow buttons */
    .carousel-btn {
        position: absolute; top: 50%; transform: translateY(-50%);
        z-index: 10;
        background: rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.15);
        color: var(--white);
        width: 36px; height: 36px;
        border-radius: 2px;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.2s, border-color 0.2s, opacity 0.2s;
        backdrop-filter: blur(4px);
        opacity: 0;
        pointer-events: none;
    }
    .carousel-wrap:hover .carousel-btn {
        opacity: 1;
        pointer-events: auto;
    }
    .carousel-wrap:hover .carousel-btn:disabled {
        opacity: 0.25;
    }
    .carousel-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.4); }
    .carousel-btn svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .carousel-btn.prev { left: 0.6rem; }
    .carousel-btn.next { right: 0.6rem; }
    .carousel-btn:disabled { cursor: default; }

    /* dots */
    .carousel-dots {
        display: flex; justify-content: center; gap: 6px;
        margin-top: 0.75rem;
    }
    .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: rgba(255,255,255,0.2);
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
    }
    .dot.active { background: var(--white); transform: scale(1.25); }

    /* DETAILS */
    .product-details { max-width: 380px; }

    .product-price {
        font-family: 'Oxanium', sans-serif;
        font-size: 1.8rem; font-weight: 800;
        letter-spacing: 0.04em; margin-bottom: 1.25rem;
        text-shadow: var(--glow-sm);
    }
    .product-description {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.85rem; letter-spacing: 0.08em;
        color: var(--gray-light); text-transform: uppercase;
        line-height: 2; margin-bottom: 1.75rem; font-weight: 400;
    }

    /* COLOR SELECTOR */
    .color-selector { margin-bottom: 1.75rem; }
    .color-label {
        font-family: 'Oxanium', sans-serif;
        font-size: 0.62rem; letter-spacing: 0.3em;
        color: var(--gray-light); text-transform: uppercase;
        font-weight: 400; margin-bottom: 0.75rem;
        display: flex; align-items: center; gap: 0.5rem;
    }
    .color-label span { color: var(--white); letter-spacing: 0.15em; }
    .color-swatches { display: flex; gap: 0.6rem; }
    .swatch {
        width: 36px; height: 36px; border-radius: 2px;
        border: 1.5px solid rgba(255,255,255,0.15);
        cursor: pointer;
        transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .swatch:hover { transform: scale(1.08); border-color: rgba(255,255,255,0.4); }
    .swatch.active { border-color: var(--white); box-shadow: 0 0 0 2px rgba(255,255,255,0.15), var(--glow-sm); }
    .swatch-white { background: #ffffff; }
    .swatch-black { background: #111111; outline: 1px solid rgba(255,255,255,0.12); }

    /* SIZE SELECTOR */
    .size-selector { margin-bottom: 1.75rem; }
    .size-swatches { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .size-btn {
        min-width: 44px; height: 36px; padding: 0 0.75rem;
        border-radius: 2px;
        border: 1.5px solid rgba(255,255,255,0.15);
        background: transparent; color: var(--gray-light);
        font-family: 'Oxanium', sans-serif;
        font-size: 0.72rem; letter-spacing: 0.08em; font-weight: 600;
        cursor: pointer;
        transition: border-color 0.2s, box-shadow 0.2s, color 0.2s;
    }
    .size-btn:hover { border-color: rgba(255,255,255,0.4); color: var(--white); }
    .size-btn.active {
        border-color: var(--white); color: var(--white);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.15), var(--glow-sm);
    }

    .size-btn:disabled {
        opacity: 0.25;
        cursor: not-allowed;
        position: relative;
        overflow: hidden;
    }

    .size-btn:disabled::after {
        content: "";
        position: absolute;
        width: 140%;
        height: 1.5px;
        background: rgba(255, 255, 255, 0.55);
        top: 50%;
        left: -20%;
        transform: rotate(-45deg);
        pointer-events: none;
    }

    .inventory-status {
    margin-top: 0.65rem;
    min-height: 16px;
    font-family: 'Oxanium', sans-serif;
    font-size: 0.58rem;
    letter-spacing: 0.15em;
    color: var(--gray-light);
    text-transform: uppercase;
    }

    .inventory-status.low {
        color: var(--white);
    }

    .inventory-status.sold-out {
        color: var(--gray);
    }

    /* BUY BUTTON */
    .product-buttons { text-align: center; }
    .btn-shop {
        display: inline-block;
        font-family: 'Oxanium', sans-serif;
        font-size: 0.8rem; letter-spacing: 0.15em;
        text-transform: uppercase; font-weight: 400;
        padding: 0.85rem 2.5rem; width: 220px;
        text-align: center; text-decoration: none;
        border: 1.5px solid rgba(255,255,255,0.5);
        color: var(--white); border-radius: 2px;
        transition: all 0.25s; box-sizing: border-box;
    }
    .btn-shop:hover {
        background: var(--white); color: #000;
        border-color: var(--white); box-shadow: var(--glow-md);
    }

    /* FOOTER */
    footer {
        background: #040404;
        border-top: 1px solid var(--border);
        padding: 2rem 3rem; text-align: center;
    }
    .footer-copy {
        font-family: 'DM Sans', sans-serif;
        font-size: 0.6rem; letter-spacing: 0.15em;
        color: var(--gray); text-transform: uppercase; font-weight: 300;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        nav { padding: 1rem 1.5rem; }
        .nav-links { display: none; }
        .container { padding: 1.5rem 1.25rem; }
        .product-content { gap: 1.5rem; }
        .carousel-wrap { max-width: 420px; width: 90vw; }
        .slide { max-height: 65vh; }
        .btn-shop { width: 100%; max-width: 320px; }
        .product-buttons button, .product-buttons a { width: 100% !important; max-width: 320px; }
    }

    @media (max-width: 380px) {
        .carousel-wrap { width: 92vw; max-width: 360px; }
    }
</style>
</head>
<body>

<!-- NAV -->
<nav>
    <a href="../index.html" class="nav-logo"><img src="../imgs/frontembossed.png" alt="PHANTOM"></a>
    <ul class="nav-links">
        <li><a href="../media.html">Media</a></li>
        <li><a href="../merchList.html">Shop</a></li>
        <li><a href="../index.html">Contact</a></li>
    </ul>
    <div class="nav-social">
        <a href="https://instagram.com/phantom.nwa" target="_blank" rel="noopener">IG</a>
    </div>
</nav>

<!-- PRODUCT -->
<section class="container">
    <h2 class="section-title">Shooting Star Tee</h2>

    <div class="product-content">

        <!-- CAROUSEL -->
        <div class="carousel-wrap">
            <div class="product-image" id="productImageWrap">

                <button class="carousel-btn prev" id="prevBtn" aria-label="Previous">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <button class="carousel-btn next" id="nextBtn" aria-label="Next">
                    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </button>

                <div class="slides" id="slides">
                    <div class="slide">
                        <img src="../imgs/Merch/Drop2/Tshirt/FrontTransparent.png" alt="Shooting Star Tee">
                    </div>
                    <div class="slide">
                        <img src="../imgs/Merch/Drop2/Tshirt/tshirt.gif" alt="T-shirt animation">
                    </div>
                </div>

            </div>
            <div class="carousel-dots" id="dots"></div>
        </div>

        <!-- DETAILS -->
        <div class="product-details">

            <p class="product-price" id="productPrice">$30.00</p>

            <div class="size-selector">
                <div class="color-label">
                    Size: <span id="sizeLabel">M</span>
                </div>

                <div class="size-swatches" id="sizeSwatches"></div>

                <div class="inventory-status" id="inventoryStatus">
                    Checking availability...
                </div>
            </div>

            <div class="product-buttons" style="display:flex;flex-direction:column;gap:0.6rem;align-items:center;">
                <button class="btn-shop" id="addToCartBtn" style="cursor:pointer;width:220px;background:#fff;color:#000;border-color:#fff;">Add to Cart</button>
                <a href="#" class="btn-shop" id="buyBtn" target="_blank" style="width:220px;background:rgba(255,255,255,0.04);">Buy Now</a>
            </div>

        </div>
    </div>
</section>

<!-- FOOTER -->
<footer>
    <p class="footer-copy">© 2026 Phantom Collective</p>
</footer>

<script src="../cart.js"></script>
<script>
    const variants = {
        white: {
            S:  { price: 30.00, catalogId: 'APOJJXU5CZPE2GVFDKEYAT4F' },
            M:  { price: 30.00, catalogId: 'IOXXZI4YJADKL6T5CJSWA6LI' },
            L:  { price: 30.00, catalogId: 'QBDYUNO7JFGISFDUVVBORPSW' },
            XL: { price: 30.00, catalogId: 'KKSJAUHQUAO7I2TIKJT6OFCA' }
        }
    };

    const PRODUCT_NAME = 'Shooting Star Tee';
    const PRODUCT_IMG  = '../imgs/Merch/Drop2/Tshirt/FrontTransparent.png';

    const API_BASE = 'https://checkout.phantomnwa.shop';

    let currentColor = '';
    let currentSize  = 'M';

    let inventory = {};
    let inventoryLoaded = false;

    const slidesEl = document.getElementById('slides');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsWrap = document.getElementById('dots');

    const slideEls = slidesEl.querySelectorAll('.slide');
    const total = slideEls.length;

    let current = 0;

    slideEls.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot' + (i === 0 ? ' active' : '');
        d.addEventListener('click', () => goTo(i));
        dotsWrap.appendChild(d);
    });

    function goTo(n) {
        current = Math.max(0, Math.min(n, total - 1));
        slidesEl.style.transform = `translateX(-${current * 100}%)`;
        dotsWrap.querySelectorAll('.dot').forEach((d, i) => {
            d.classList.toggle('active', i === current);
        });
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === total - 1;
    }

    prevBtn.addEventListener('click', () => goTo(current - 1));
    nextBtn.addEventListener('click', () => goTo(current + 1));

    let touchStartX = 0;
    slidesEl.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    slidesEl.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) { goTo(diff > 0 ? current + 1 : current - 1); }
    });

    goTo(0);

    const imageWrap = document.getElementById('productImageWrap');
    const priceEl = document.getElementById('productPrice');
    const buyBtn = document.getElementById('buyBtn');
    const colorName = document.getElementById('colorName');
    const swatches = document.querySelectorAll('.swatch');
    const addBtn = document.getElementById('addToCartBtn');
    const sizeSwatches = document.getElementById('sizeSwatches');
    const sizeLabel = document.getElementById('sizeLabel');
    const inventoryStatus = document.getElementById('inventoryStatus');

    function currentVariant() {
        return (variants[currentColor] && variants[currentColor][currentSize]);
    }

    function getStock(catalogId) {
        if (!inventory[catalogId]) { return 0; }
        const item = inventory[catalogId];
        if (item.state && item.state !== 'IN_STOCK') { return 0; }
        return Math.max(0, Number(item.quantity || 0));
    }

    async function loadInventory() {
        inventoryStatus.textContent = 'Checking availability...';
        inventoryStatus.className = 'inventory-status';
        try {
            const ids = [];
            Object.values(variants[currentColor]).forEach(variant => {
                if (variant.catalogId) { ids.push(variant.catalogId); }
            });
            const response = await fetch(`${API_BASE}/inventory?ids=${encodeURIComponent(ids.join(','))}`, { method: 'GET', cache: 'no-store' });
            if (!response.ok) { throw new Error(`Inventory request failed: ${response.status}`); }
            const data = await response.json();
            inventory = data.inventory || {};
            inventoryLoaded = true;
            renderSizeButtons();
            updateCurrentSelection();
        }
        catch (error) {
            console.error('Inventory error:', error);
            inventoryLoaded = false;
            inventoryStatus.textContent = 'Availability unavailable';
            inventoryStatus.className = 'inventory-status';
            renderSizeButtons(false);
        }
    }

    function renderSizeButtons(useInventory = true) {
        const sizes = Object.keys(variants[currentColor] || {});
        sizeSwatches.innerHTML = '';
        sizes.forEach(size => {
            const variant = variants[currentColor][size];
            const stock = useInventory ? getStock(variant.catalogId) : null;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'size-btn' + (size === currentSize ? ' active' : '');
            btn.textContent = size;
            if (useInventory && stock <= 0) {
                btn.disabled = true;
                btn.title = `${size} — Sold Out`;
            } else {
                btn.addEventListener('click', () => selectSize(size));
            }
            sizeSwatches.appendChild(btn);
        });

        if (useInventory) {
            const current = variants[currentColor][currentSize];
            const currentStock = current ? getStock(current.catalogId) : 0;
            if (currentStock <= 0) {
                const firstAvailable = sizes.find(size => getStock(variants[currentColor][size].catalogId) > 0);
                if (firstAvailable) { currentSize = firstAvailable; }
            }
        }

        sizeSwatches.querySelectorAll('.size-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent === currentSize);
        });

        if (sizeLabel) { sizeLabel.textContent = currentSize; }
    }

    function selectSize(size) {
        if (!variants[currentColor] || !variants[currentColor][size]) { return; }
        const variant = variants[currentColor][size];
        if (inventoryLoaded) {
            const stock = getStock(variant.catalogId);
            if (stock <= 0) { return; }
        }
        currentSize = size;
        if (sizeLabel) { sizeLabel.textContent = size; }
        sizeSwatches.querySelectorAll('.size-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent === size);
        });
        refreshPriceAndButton();
        updateInventoryMessage();
    }

    function selectVariant(color) {
        if (!variants[color]) { return; }
        currentColor = color;
        const sizesForColor = Object.keys(variants[color]);
        if (!sizesForColor.includes(currentSize)) { currentSize = sizesForColor[0]; }
        imageWrap.classList.toggle('variant-black', color === 'black');
        if (colorName) { colorName.textContent = color.charAt(0).toUpperCase() + color.slice(1); }
        swatches.forEach(s => { s.classList.toggle('active', s.dataset.color === color); });
        renderSizeButtons();
        if (sizeLabel) { sizeLabel.textContent = currentSize; }
        refreshPriceAndButton();
        loadInventory();
    }

    swatches.forEach(s => { s.addEventListener('click', () => selectVariant(s.dataset.color)); });

    function refreshPriceAndButton() {
        const v = currentVariant();
        if (!v) { return; }
        priceEl.textContent = '$' + v.price.toFixed(2);
        if (buyBtn) { buyBtn.href = '#'; }
    }

    function updateInventoryMessage() {
        if (!inventoryLoaded) {
            inventoryStatus.textContent = 'Availability unavailable';
            inventoryStatus.className = 'inventory-status';
            return;
        }
        const v = currentVariant();
        if (!v) { return; }
        const stock = getStock(v.catalogId);
        if (stock <= 0) {
            inventoryStatus.textContent = 'Sold out';
            inventoryStatus.className = 'inventory-status sold-out';
            addBtn.disabled = true;
            return;
        }
        addBtn.disabled = false;
        if (stock <= 5) {
            inventoryStatus.textContent = `Only ${stock} left`;
            inventoryStatus.className = 'inventory-status low';
        } else {
            inventoryStatus.textContent = 'In stock';
            inventoryStatus.className = 'inventory-status';
        }
    }

    function updateCurrentSelection() {
        refreshPriceAndButton();
        updateInventoryMessage();
    }

    addBtn.addEventListener('click', async () => {
        const v = currentVariant();
        if (!v) { alert('Please select a size.'); return; }
        addBtn.disabled = true;
        addBtn.textContent = 'Checking...';
        try {
            await loadInventory();
            const freshVariant = currentVariant();
            const stock = getStock(freshVariant.catalogId);
            if (stock <= 0) {
                alert(`Size ${currentSize} is sold out.`);
                addBtn.textContent = 'Sold Out';
                updateInventoryMessage();
                return;
            }
            window.PhantomCart.addItem({
                id: freshVariant.catalogId,
                name: PRODUCT_NAME,
                color: currentColor,
                size: currentSize,
                price: freshVariant.price,
                image: PRODUCT_IMG,
                noFilter: true
            });
            addBtn.textContent = 'Added ✓';
            setTimeout(() => {
                addBtn.textContent = 'Add to Cart';
                updateInventoryMessage();
            }, 1500);
        }
        catch (error) {
            console.error('Add to cart error:', error);
            addBtn.textContent = 'Try Again';
            addBtn.disabled = false;
        }
    });

    buyBtn.addEventListener('click', async event => {
        event.preventDefault();
        const v = currentVariant();
        if (!v) { alert('Please select a size.'); return; }
        buyBtn.textContent = 'Checking...';
        try {
            await loadInventory();
            const freshVariant = currentVariant();
            const stock = getStock(freshVariant.catalogId);
            if (stock <= 0) {
                alert(`Size ${currentSize} is sold out.`);
                buyBtn.textContent = 'Buy Now';
                return;
            }
            buyBtn.textContent = 'Loading...';
            const response = await fetch(`${API_BASE}/create-checkout`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cart: [{ id: freshVariant.catalogId, qty: 1, color: currentColor, size: currentSize }]
                })
            });
            const data = await response.json();
            if (!response.ok || !data.checkoutUrl) {
                throw new Error(data.error || 'Unable to create checkout');
            }
            window.location.href = data.checkoutUrl;
        }
        catch (error) {
            console.error('Buy Now error:', error);
            alert('Unable to start checkout. Please try again.');
            buyBtn.textContent = 'Buy Now';
        }
    });

    async function initializeProduct() {
        renderSizeButtons(false);
        refreshPriceAndButton();
        await loadInventory();
    }

    initializeProduct();
    setInterval(loadInventory, 30000);
</script>

</body>
</html>
